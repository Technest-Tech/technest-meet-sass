# LiveKit Server Configuration
# This file configures the LiveKit server for local development

# Server settings
port: 7880
bind_addresses: ["0.0.0.0"]

# API keys for authentication
keys:
  devkey: secret

# Logging
log_level: info

# Room settings
room:
  # Allow room creation
  auto_create: true

# Development mode (no database required)
development: true

# Recording configuration
egress:
  # Enable recording functionality
  enabled: true
  # Allow room composite recording
  room_composite: true
  # Allow track composite recording
  track_composite: true
  # Allow track recording
  track: true
  # Allow web recording
  web: true
