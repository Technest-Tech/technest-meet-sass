name: almajd-meet
services:
- name: web
  source_dir: /
  github:
    repo: your-username/your-repo-name
    branch: main
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  envs:
  - key: NODE_ENV
    value: production
  - key: DATABASE_URL
    value: file:/app/data/prod.db
  - key: JWT_SECRET
    value: almajd-meet-jwt-secret-2024-production-key-64chars-minimum
  - key: LIVEKIT_API_KEY
    value: almajd-meet-api-key-prod-2024
  - key: LIVEKIT_API_SECRET
    value: almajd-meet-api-secret-production-2024-secure-key
  - key: LIVEKIT_URL
    value: http://livekit-server:7880
  - key: NEXT_PUBLIC_LIVEKIT_URL
    value: wss://your-app-name.ondigitalocean.app/rtc
  - key: NEXT_PUBLIC_LK_RECORD_ENDPOINT
    value: /api/record
  dockerfile_path: Dockerfile

- name: livekit
  source_dir: /
  github:
    repo: your-username/your-repo-name
    branch: main
  dockerfile_path: Dockerfile.livekit
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 7880
  envs:
  - key: LIVEKIT_KEYS
    value: almajd-meet-api-key-prod-2024: almajd-meet-api-secret-production-2024-secure-key
