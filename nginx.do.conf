events {
    worker_connections 1024;
}

http {
    upstream newmeet-backend {
        server newmeet-backend:3000;
    }

    upstream livekit-server {
        server livekit-server:7880;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name academy.the-doable.com 152.42.249.147 _;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server with Let's Encrypt certificate
    server {
        listen 443 ssl http2;
        server_name academy.the-doable.com 152.42.249.147 _;

        ssl_certificate /etc/letsencrypt/live/academy.the-doable.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/academy.the-doable.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 100M;

        # LiveKit WebSocket and API proxy
        location /rtc {
            proxy_pass http://livekit-server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # Main application
        location / {
            proxy_pass http://newmeet-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://newmeet-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://newmeet-backend/api/health;
            access_log off;
        }
    }
}
