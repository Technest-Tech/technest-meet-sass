events {
    worker_connections 1024;
}

http {
    upstream newmeet-backend {
        server newmeet-backend:3000;
    }

    upstream livekit-server {
        server livekit:7880;
    }

    # HTTP server - accessible by IP
    server {
        listen 80;
        server_name 152.42.249.147 _;

        # Increase body size for file uploads
        client_max_body_size 100M;

        # LiveKit WebSocket and API proxy
        location /rtc {
            proxy_pass http://livekit-server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # Main application
        location / {
            proxy_pass http://newmeet-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://newmeet-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://newmeet-backend/api/health;
            access_log off;
        }
    }

    # HTTPS server (optional - for SSL if you add certificates later)
