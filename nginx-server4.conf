events {
    worker_connections 1024;
}

http {
    upstream livekit {
        server livekit-server:7880;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name rtc2.acadmyq.com _;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server for LiveKit WebSocket
    server {
        listen 443 ssl http2;
        server_name rtc2.acadmyq.com _;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/rtc2.acadmyq.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rtc2.acadmyq.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # LiveKit WebSocket and API proxy - match /rtc and all sub-paths
        location ~ ^/rtc(/.*)?$ {
            proxy_pass http://livekit$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # Default location - return 404 for non-LiveKit routes
        location / {
            return 404;
        }
    }
}

